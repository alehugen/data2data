<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data2data</title>
    <script>
      try {
        const pref = localStorage.getItem('data2data:theme') || 'dark'
        const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <style>
      html {
        color-scheme: light;
        background: #f3f2fa;
        color: #1c1a36;
        --boot-accent: #137a52;
        --boot-track: #dedbef;
      }
      html.dark {
        color-scheme: dark;
        background: #1c1a36;
        color: #efedff;
        --boot-accent: #7fe3bd;
        --boot-track: #35326a;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        font-family: 'Space Grotesk Variable', ui-sans-serif, system-ui, sans-serif;
        opacity: 0;
        animation: boot-in 300ms ease-out 150ms forwards;
      }
      .boot-logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .boot-logo span {
        color: var(--boot-accent);
      }
      .boot-track {
        position: relative;
        width: 7rem;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-track);
      }
      .boot-track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-slide 1100ms cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation-duration: 1ms;
        }
        .boot-track::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-logo" aria-hidden="true">data<span>2</span>data</div>
        <div class="boot-track" aria-hidden="true"></div>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Carregando o data2data</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
